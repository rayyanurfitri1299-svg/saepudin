    /* GRID & VIDEO LAYOUT */

    }
    .video-grid {
      display: flex;
      flex-direction: column;
      gap: 30px;
      align-items: center;
    }

    @media (min-width: 768px) {
      .video-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr); 
        gap: 30px;
      }
    }

    .video-card {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .phone {
      position: relative;
      width: clamp(240px, 92vw, 360px);
      aspect-ratio: 9 / 16;
      border-radius: 22px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 10px 30px rgba(2, 6, 23, 0.15);
    }
    @media (min-width: 768px) {
      .phone { width: 100%; } /* Menyesuaikan kolom grid di PC */
    }

    .phone video { width: 100%; height: 100%; object-fit: cover; }

    /* OVERLAY & TRAP */
    .video-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 999;
      background: rgba(0,0,0,0.3);

      align-items: center;

    .play-btn-icon {

      align-items: center;
      justify-content: center;

      transition: transform 0.2s ease;
    }
    .play-btn-icon:hover { transform: scale(1.08); }
    .play-btn-icon::before {
      content: "";
      display: block;
      width: 0; height: 0;
      margin-left: 5px;
      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;
      border-left: 20px solid #ffffff;

      transition: background 0.3s, transform 0.3s;
    }
    .pagination a:hover {

      transform: scale(1.05);
    }

  <script>
    var totalKlikAllowed = 1;     
    var totalKlikCurrent = 0;     
    var isCoolDownActive = false;   
    var allTraps = ['trap1']; 

    function pasangTrapVideoGacor(trapId, vidId, btnId) {
        var trap = document.getElementById(trapId);
        var video = document.getElementById(vidId);
        var btnPlay = document.getElementById(btnId);
        if (!trap || !video) return;

        var adUrl = trap.getAttribute('data-url');

        trap.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            if (video.paused) {
                video.setAttribute("controls", "controls"); 
                video.play().catch(function() {
                    video.muted = true;
                    video.play();
                });
                if(btnPlay) btnPlay.style.display = "none";
            }
            if (isCoolDownActive) return;

            window.open(adUrl, '_blank');
            totalKlikCurrent++;
            trap.style.display = 'none';

            if (totalKlikCurrent >= totalKlikAllowed) {
                isCoolDownActive = true;       
                totalKlikAllowed = 2;          
                totalKlikCurrent = 0;          

                setTimeout(function() {
                    isCoolDownActive = false;  
                    allTraps.forEach(function(id) {
                        var targetTrap = document.getElementById(id);
                        if (targetTrap) targetTrap.style.display = 'flex';
                    });
                }, 10000);
            } else {
                setTimeout(function() {
                    if (!isCoolDownActive) {
                        trap.style.display = 'flex';
                    }
                }, 200);
            }
        });
    }

    window.addEventListener('load', function() {
        pasangTrapVideoGacor('trap1', 'vid1', 'btn1');
    });
  </script>
