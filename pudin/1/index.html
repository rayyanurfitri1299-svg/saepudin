<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>vitamin malam</title>

  <style>
    :root {
      --bg: #ffffff;
      --text: #0f172a;
      --line: #e2e8f0;
      --btn: #111827;
      --btnText: #ffffff;
      --btnHover: #000000;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%; margin: 0; padding: 0;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      color: var(--text); background: var(--bg); line-height: 1.45; overflow-x: hidden;
    }

    .appbar {
      position: sticky; top: 0; z-index: 20;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: saturate(180%) blur(8px);
      border-bottom: 1px solid var(--line);
    }

    .bar-inner {
      width: 100%; max-width: 1200px; margin-inline: auto;
      display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    }

    .brand { 
      display: flex; align-items: center; gap: 8px; font-weight: 800; 
      text-decoration: none; color: inherit;
    }

    .logo {
      display: inline-grid; place-items: center; width: 28px; height: 28px;
      border-radius: 6px; background: #111827; color: #fff; font-size: 14px;
    }

    .spacer { flex: 1; }

    .btn-upload {
      background-color: #0f172a;
      color: #ffffff;
      padding: 8px 20px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s ease;
    }

    .btn-upload:hover {
      background-color: #000000;
    }

    .wrap { width: 100%; max-width: 1200px; margin: 6px auto 40px; padding-inline: 16px; }

    .player-shell { display: grid; place-items: center; margin-top: 20px; }

    .phone {
      position: relative;
      width: clamp(240px, 92vw, 420px);
      aspect-ratio: 9 / 16;
      border-radius: 22px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 10px 30px rgba(2, 6, 23, 0.15);
    }

    .phone video { width: 100%; height: 100%; object-fit: cover; }

    @media (min-width: 1024px) {
      .wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 480px) minmax(0, 1fr); }
      .player-shell { grid-column: 2; }
    }
  </style>
</head>
<body>

  <header class="appbar">
    <div class="bar-inner">
      <div class="brand">
        <span class="logo">V</span>
        <span>VIDEY</span>
      </div>
      <div class="spacer"></div>
      <a href="#" class="btn-upload">
        Upload
      </a>
    </div>
  </header>

  <main class="wrap">
    <section class="player-shell">
      <div class="phone">
        <video id="myVideo" controls playsinline preload="metadata" src="VID-20260813-WA0000.mp4"></video>
      </div>
    </section>
  </main>

</body>
</html>
